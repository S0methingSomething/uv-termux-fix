          - **Version**: `${{ steps.parse.outputs.version }}`
          - **Architecture**: `aarch64`
          - **Size**: `$(numfmt --to=iec-i --suffix=B ${{ env.DEB_SIZE }})`
          - **MD5**: `${{ env.DEB_MD5 }}`
          - **SHA256**: `${{ env.DEB_SHA256 }}`
          
          ### 📚 Documentation
          
          Visit the [repository homepage](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}) for full installation instructions, verification steps, and troubleshooting.
          
