cd ..
uv init test2 && cd test2
uv add pyzmq  # Should use cached version!</code></pre>
    
    <div class="success">
      <strong>Expected:</strong> Second project shows "Prepared 0 packages" 🎉
    </div>
    
    <h2>📊 Package Info</h2>
    <ul>
      <li><strong>Version:</strong> <code>VERSION</code></li>
      <li><strong>Architecture:</strong> <code>aarch64</code></li>
      <li><strong>Size:</strong> <code>SIZE</code></li>
      <li><strong>SHA256:</strong> <code>SHA256</code></li>
    </ul>
    
    <h2>🐛 Issues</h2>
    <ul>
      <li><a href="https://github.com/astral-sh/uv/issues/9559">Original Issue #9559</a></li>
      <li><a href="https://github.com/GITHUB_REPO">Report build issues</a></li>
    </ul>
    
    <hr style="margin: 40px 0; border: none; border-top: 1px solid #e2e8f0;">
    <p style="text-align: center; color: #64748b; font-size: 0.9em;">
      Built from <a href="https://github.com/termux/termux-packages/blob/657cff43a61c058694e83bc1e575cfeda9444ec0/packages/uv/build.sh">Termux's official build specs</a>
      <br>Last updated: DATE
    </p>
  </div>
</body>
</html>
EOFHTML
        
        # Substitute variables
        sed -i "s/VERSION/${VERSION}/g" repo/index.html
        sed -i "s/SIZE/$(numfmt --to=iec-i --suffix=B "${{ env.DEB_SIZE }}")/g" repo/index.html
        sed -i "s/SHA256/${{ env.DEB_SHA256 }}/g" repo/index.html
        sed -i "s/DEB_FILE/${DEB_FILE}/g" repo/index.html
        sed -i "s|GITHUB_USER|${{ github.repository_owner }}|g" repo/index.html
        sed -i "s|REPO_NAME|${{ github.event.repository.name }}|g" repo/index.html
        sed -i "s|GITHUB_REPO|${{ github.repository }}|g" repo/index.html
        sed -i "s/DATE/$(date -R)/g" repo/index.html
        
        echo "✅ Repository created"
        
    - name: Deploy to GitHub Pages
      if: steps.check.outputs.exists == 'false'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./repo
        publish_branch: gh-pages
        force_orphan: true
        
    - name: Create GitHub Release
      if: steps.check.outputs.exists == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.parse.outputs.version }}
        name: uv ${{ steps.parse.outputs.version }} for Termux
        files: ${{ env.DEB_FILE }}
        body: |
          ## 📦 uv ${{ steps.parse.outputs.version }} for Termux (Android Fix)
          
          Built from [Termux's official build specs](https://github.com/termux/termux-packages/blob/657cff43a61c058694e83bc1e575cfeda9444ec0/packages/uv/build.sh) with Android platform detection fix.
          
          ### ✅ What's Fixed
          
          - **Android platform only detected on Python 3.13+** (per PEP 738)
          - **Python <3.13 uses Linux platform tags** (matches setuptools behavior)
          - **Prevents cache invalidation** and unnecessary rebuilds
          - **Resolves [issue #9559](https://github.com/astral-sh/uv/issues/9559)**
          
          ### 📥 Quick Install
          
          ```bash
          # Add repository
          echo "deb https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }} termux main" | \
            tee $PREFIX/etc/apt/sources.list.d/uv-fixed.list
          
          # Install
          pkg update && pkg install uv-fixed
          ```
          
          ### 📦 Package Information
          
          - **Version**: `${{ steps.parse.outputs.version }}`
          - **Architecture**: `aarch64`
          - **Size**: `$(numfmt --to=iec-i --suffix=B ${{ env.DEB_SIZE }})`
          - **SHA256**: `${{ env.DEB_SHA256 }}`
          
          Visit the [repository homepage](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}) for full documentation.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
