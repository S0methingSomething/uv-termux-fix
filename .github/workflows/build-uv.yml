name: Build UV for Termux

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      uv_version: ${{ steps.check.outputs.uv_version }}
    steps:
      - name: Get latest UV version
        id: uv_latest
        run: |
          UV_VERSION=$(curl -s https://api.github.com/repos/astral-sh/uv/releases/latest | jq -r .tag_name)
          echo "version=$UV_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Latest UV version: $UV_VERSION"
      
      - name: Check if already built
        id: check
        run: |
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name 2>/dev/null || echo "none")
          echo "🏷️  Last built version: $LATEST_RELEASE"
          
          if [ "$LATEST_RELEASE" != "${{ steps.uv_latest.outputs.version }}" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "uv_version=${{ steps.uv_latest.outputs.version }}" >> $GITHUB_OUTPUT
            echo "✅ New version detected - will build"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "⏭️  Already up to date - skipping build"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # ----------------------------------------------------------------
      # CACHE 1: DOCKER IMAGE (CONSUMER MODE)
      # We look for the cache created by the "Refresh" workflow
      # ----------------------------------------------------------------
      - name: Restore Docker image cache
        id: docker-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/docker-save
          # We use a unique key for this run to avoid save errors...
          key: termux-builder-image-build-${{ github.run_id }}
          # ...but we RESTORE from the generic prefix created by the Refresh workflow
          restore-keys: |
            termux-builder-image-
          
      - name: Load or Pull Docker image
        run: |
          if [ "${{ steps.docker-cache.outputs.cache-hit }}" == "true" ]; then
            echo "📦 Cache hit! Loading Docker image..."
            docker load -i /tmp/docker-save/termux-builder.tar
            echo "✅ Image loaded from cache"
          else
            echo "⚠️ Cache miss. Pulling from Docker Hub..."
            docker pull termux/package-builder:latest
          fi
      
      # ----------------------------------------------------------------
      # CACHE 2: TERMUX PACKAGES (CONSUMER MODE)
      # ----------------------------------------------------------------
      - name: Restore termux-packages repo
        id: termux-cache
        uses: actions/cache/restore@v4
        with:
          path: termux-packages
          key: termux-packages-build-${{ github.run_id }}
          restore-keys: |
            termux-packages-
            
      - name: Clone or update termux-packages
        run: |
          if [ -d "termux-packages/.git" ]; then
            echo "📦 Updating cached termux-packages..."
            cd termux-packages
            git fetch origin
            git reset --hard origin/master
            cd ..
          else
            echo "📥 Cloning termux-packages (first time)..."
            git clone --depth=1 https://github.com/termux/termux-packages
          fi
      
      # ----------------------------------------------------------------
      # CACHE 3: CARGO REGISTRY (CONSUMER MODE)
      # ----------------------------------------------------------------
      - name: Restore Cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-build-${{ github.run_id }}
          restore-keys: |
            cargo-registry-
      
      - name: Build UV for aarch64
        run: |
          VERSION="${{ needs.check-version.outputs.uv_version }}"
          echo "🔨 Building UV $VERSION for aarch64..."
          
          cd termux-packages
          
          # Update version and skip checksum
          sed -i "s/TERMUX_PKG_VERSION=.*/TERMUX_PKG_VERSION=\"$VERSION\"/" packages/uv/build.sh
          sed -i "s/TERMUX_PKG_SHA256=.*/TERMUX_PKG_SHA256=SKIP_CHECKSUM/" packages/uv/build.sh
          
          # Ensure Termux's sys-info patch exists
          if [ ! -f "packages/uv/0001-sys-info-replace-index-with-strchr.diff" ]; then
            echo "📥 Downloading Termux sys-info patch..."
            wget -q -O packages/uv/0001-sys-info-replace-index-with-strchr.diff \
              https://raw.githubusercontent.com/termux/termux-packages/master/packages/uv/0001-sys-info-replace-index-with-strchr.diff || \
              echo "⚠️  Sys-info patch not found (may not be needed for this version)"
          fi
          
          # Remove Termux's old fs2 patch and use our ported version
          echo "🗑️  Removing Termux's old fs2 patch..."
          rm -f packages/uv/00002-revert-to-shared-lock.patch
          
          echo "📥 Copying our ported fs2 file locking patch..."
          cp ../patches/uv-0.10.3-android-fs2.patch packages/uv/00002-android-fs2-ported.patch
          
          # Copy Android platform detection fix patch
          echo "🔧 Copying Android platform detection fix patch..."
          cp ../patches/0002-fix-android-platform-detection-for-python-pre-3.13.patch packages/uv/0003-fix-android-platform-detection.patch
          
          echo "📋 Build configuration:"
          echo "  UV Version: $VERSION"
          echo "  Patches: sys-info fix + fs2 file locking + Android platform detection fix"
          echo ""
          
          echo "🚀 Starting build..."
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 uv
          
          # Verify the build output
          if [ -f "output/uv_${VERSION}_aarch64.deb" ]; then
            echo "✅ Build complete! Package created:"
            ls -lh output/uv_*.deb
          else
            echo "❌ Build failed - .deb package not found"
            exit 1
          fi
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uv-aarch64
          path: termux-packages/output/*.deb
          retention-days: 30

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: debs
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-version.outputs.uv_version }}
          name: UV ${{ needs.check-version.outputs.uv_version }} for Termux
          body: |
            UV ${{ needs.check-version.outputs.uv_version }} built for Termux with Android platform detection fix.
            
            ## 🚀 Installation
            
            ### Quick Install
            ```bash
            pkg install wget
            wget https://github.com/${{ github.repository }}/releases/download/${{ needs.check-version.outputs.uv_version }}/uv_${{ needs.check-version.outputs.uv_version }}_aarch64.deb
            pkg install ./uv_*.deb
            ```
            
            ### Recommended Setup
            Add to your `~/.bashrc` to avoid file locking issues:
            ```bash
            export UV_CACHE_DIR=$PREFIX/tmp/uv-cache
            mkdir -p $PREFIX/tmp/uv-cache
            ```
            
            ## ✅ What's Fixed
            
            This build includes a critical fix for [issue #9559](https://github.com/astral-sh/uv/issues/9559):
            
            - **Python <3.13**: Returns `manylinux_2_17` platform tags (matches setuptools behavior)
            - **Python 3.13+**: Returns `android` platform tags (per PEP 738)
            - **Result**: Prevents unnecessary package rebuilds and enables proper cache reuse
            
            ## 📦 Package Info
            
            - **Version**: ${{ needs.check-version.outputs.uv_version }}
            - **Architecture**: aarch64 (64-bit ARM)
            - **Patches Applied**: 
              - Termux sys-info compatibility fix
              - Android platform detection fix (Python <3.13)
            
          files: debs/**/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
