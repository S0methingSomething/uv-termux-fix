name: Build UV for Termux

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # VERSION CHECK
      # ---------------------------------------------------------------
      - name: Check if should build
        id: check
        run: |
          UV_VERSION=$(curl -s https://api.github.com/repos/astral-sh/uv/releases/latest | jq -r .tag_name)
          echo "uv_version=$UV_VERSION" >> $GITHUB_OUTPUT
          echo "Latest UV version: $UV_VERSION"

          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Build triggered by ${{ github.event_name }}"
          else
            LATEST_RELEASE=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name 2>/dev/null || echo "none")
            echo "Last built version: $LATEST_RELEASE"
            if [ "$LATEST_RELEASE" != "$UV_VERSION" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "New version detected - will build"
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
              echo "Already up to date - skipping build"
            fi
          fi

      # ---------------------------------------------------------------
      # SETUP
      # ---------------------------------------------------------------
      - name: Clone termux-packages
        if: steps.check.outputs.should_build == 'true'
        run: git clone --depth=1 https://github.com/termux/termux-packages

      # Cache the Rust compilation artifacts (.termux-build contains
      # the cargo target/ directory). This is the single biggest
      # speed-up — avoids recompiling ~800 crates from scratch.
      - name: Restore build cache
        if: steps.check.outputs.should_build == 'true'
        id: build-cache
        uses: actions/cache@v4
        with:
          path: .termux-build
          key: termux-build-${{ steps.check.outputs.uv_version }}-${{ github.sha }}
          restore-keys: |
            termux-build-${{ steps.check.outputs.uv_version }}-
            termux-build-

      # ---------------------------------------------------------------
      # BUILD
      # ---------------------------------------------------------------
      - name: Build UV for aarch64
        if: steps.check.outputs.should_build == 'true'
        run: |
          VERSION="${{ steps.check.outputs.uv_version }}"
          echo "Building UV $VERSION for aarch64..."

          cd termux-packages

          # Update version and skip checksum
          sed -i "s/TERMUX_PKG_VERSION=.*/TERMUX_PKG_VERSION=\"$VERSION\"/" packages/uv/build.sh
          sed -i "s/TERMUX_PKG_SHA256=.*/TERMUX_PKG_SHA256=SKIP_CHECKSUM/" packages/uv/build.sh

          # Ensure Termux's sys-info patch exists
          if [ ! -f "packages/uv/0001-sys-info-replace-index-with-strchr.diff" ]; then
            wget -q -O packages/uv/0001-sys-info-replace-index-with-strchr.diff \
              https://raw.githubusercontent.com/termux/termux-packages/master/packages/uv/0001-sys-info-replace-index-with-strchr.diff || \
              echo "Sys-info patch not found (may not be needed for this version)"
          fi

          # Copy our manylinux compatibility patch
          cp ../patches/0001-android-accept-manylinux-wheels.patch packages/uv/0002-android-accept-manylinux-wheels.patch

          echo "Build configuration:"
          echo "  UV Version: $VERSION"
          echo "  Patches: sys-info fix + android manylinux compatibility"

          # Mount the build cache into the container so cargo can
          # reuse previously compiled artifacts.
          mkdir -p ../.termux-build
          export TERMUX_DOCKER_RUN_EXTRA_ARGS="--volume ${{ github.workspace }}/.termux-build:/home/builder/.termux-build"

          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 uv

          if [ -f "output/uv_${VERSION}_aarch64.deb" ]; then
            echo "Build complete!"
            ls -lh output/uv_*.deb
          else
            echo "Build failed - .deb package not found"
            exit 1
          fi

      # ---------------------------------------------------------------
      # RELEASE
      # ---------------------------------------------------------------
      - name: Create release
        if: steps.check.outputs.should_build == 'true'
        run: |
          VERSION="${{ steps.check.outputs.uv_version }}"

          BODY=$(curl -sfL \
            "https://api.github.com/repos/astral-sh/uv/releases/tags/$VERSION" \
            | jq -r '.body // empty')

          if [ -z "$BODY" ]; then
            BODY="*Could not fetch upstream changelog. See [astral-sh/uv releases](https://github.com/astral-sh/uv/releases/tag/$VERSION).*"
          fi

          {
            echo '> **This is a modified build of UV for Termux.** It includes a patch that makes UV accept both `android` and `manylinux` tagged wheels, fixing cache mismatches that cause endless package rebuilds ([#9559](https://github.com/astral-sh/uv/issues/9559)).'
            echo ''
            echo '## Installation'
            echo ''
            echo '```bash'
            echo 'pkg install wget'
            echo "wget https://github.com/${{ github.repository }}/releases/download/${VERSION}/uv_${VERSION}_aarch64.deb"
            echo 'pkg install ./uv_*.deb'
            echo '```'
            echo ''
            echo '---'
            echo ''
            echo '## Upstream Changelog'
            echo ''
            echo "$BODY"
          } > /tmp/release-body.md

      - name: Publish release
        if: steps.check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.uv_version }}
          name: UV ${{ steps.check.outputs.uv_version }} for Termux (modified)
          body_path: /tmp/release-body.md
          files: termux-packages/output/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
