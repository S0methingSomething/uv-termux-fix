name: Build UV for Termux

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      uv_version: ${{ steps.check.outputs.uv_version }}
    steps:
      - name: Get latest UV version
        id: uv_latest
        run: |
          UV_VERSION=$(curl -s https://api.github.com/repos/astral-sh/uv/releases/latest | jq -r .tag_name)
          echo "version=$UV_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Latest UV version: $UV_VERSION"
      
      - name: Check if already built
        id: check
        run: |
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name 2>/dev/null || echo "none")
          echo "🏷️  Last built version: $LATEST_RELEASE"
          
          if [ "$LATEST_RELEASE" != "${{ steps.uv_latest.outputs.version }}" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "uv_version=${{ steps.uv_latest.outputs.version }}" >> $GITHUB_OUTPUT
            echo "✅ New version detected - will build"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "⏭️  Already up to date - skipping build"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Cache 1: Docker image (saves ~2 minutes)
      - name: Cache Docker image
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-save
          key: termux-builder-image-v1
          
      - name: Load cached Docker image
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          echo "📦 Loading Docker image from cache..."
          docker load -i /tmp/docker-save/termux-builder.tar
          echo "✅ Loaded from cache (saved ~2 minutes)"
          
      - name: Pull and save Docker image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          echo "📥 Pulling Docker image (first time or cache expired)..."
          docker pull termux/package-builder:latest
          mkdir -p /tmp/docker-save
          echo "💾 Saving to cache for next time..."
          docker save termux/package-builder:latest -o /tmp/docker-save/termux-builder.tar
          echo "✅ Docker image cached"
      
      # Cache 2: termux-packages repo (saves ~30 seconds)
      - name: Cache termux-packages repo
        id: termux-cache
        uses: actions/cache@v4
        with:
          path: termux-packages
          key: termux-packages-build-${{ github.run_id }}
          restore-keys: |
            termux-packages-
            
      - name: Clone or update termux-packages
        run: |
          if [ -d "termux-packages/.git" ]; then
            echo "📦 Updating cached termux-packages..."
            cd termux-packages
            git fetch origin
            git reset --hard origin/master
            cd ..
          else
            echo "📥 Cloning termux-packages (first time)..."
            git clone --depth=1 https://github.com/termux/termux-packages
          fi
      
      # Cache 3: Cargo registry (saves time on dependencies)
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-build-${{ needs.check-version.outputs.uv_version }}
          restore-keys: |
            cargo-registry-
      
      - name: Build UV for aarch64
        run: |
          VERSION="${{ needs.check-version.outputs.uv_version }}"
          echo "🔨 Building UV $VERSION for aarch64..."
          
          cd termux-packages
          
          # Update version and skip checksum
          sed -i "s/TERMUX_PKG_VERSION=.*/TERMUX_PKG_VERSION=\"$VERSION\"/" packages/uv/build.sh
          sed -i "s/TERMUX_PKG_SHA256=.*/TERMUX_PKG_SHA256=SKIP_CHECKSUM/" packages/uv/build.sh
          
          # Ensure Termux's sys-info patch exists
          if [ ! -f "packages/uv/0001-sys-info-replace-index-with-strchr.diff" ]; then
            echo "📥 Downloading Termux sys-info patch..."
            wget -q -O packages/uv/0001-sys-info-replace-index-with-strchr.diff \
              https://raw.githubusercontent.com/termux/termux-packages/master/packages/uv/0001-sys-info-replace-index-with-strchr.diff || \
              echo "⚠️  Sys-info patch not found (may not be needed for this version)"
          fi
          
          # Create our Android platform detection fix patch
          echo "🔧 Creating Android platform detection fix patch..."
          cat > packages/uv/0002-fix-android-platform-detection.patch << 'EOF'
          --- a/crates/uv-python/python/get_interpreter_info.py
          +++ b/crates/uv-python/python/get_interpreter_info.py
          @@ -462,6 +462,13 @@ def get_operating_system_and_architecture() -> dict:
                           "major": glibc_version[0],
                           "minor": glibc_version[1],
                       }
          +        elif hasattr(sys, "getandroidapilevel") and sys.version_info < (3, 13):
          +            # Python <3.13 on Android: return manylinux for compatibility with setuptools
          +            operating_system = {
          +                "name": "manylinux",
          +                "major": 2,
          +                "minor": 17,
          +            }
                   elif hasattr(sys, "getandroidapilevel"):
                       operating_system = {
                           "name": "android",
          EOF
          
          # Add our patch application to build.sh (after the sys-info patch)
          echo "🔧 Modifying build.sh to apply our patch..."
          cat >> packages/uv/build.sh << 'EOFBUILD'
          
          termux_step_post_get_source() {
              # Apply Android platform detection fix
              if [ -f "${TERMUX_PKG_BUILDER_DIR}/0002-fix-android-platform-detection.patch" ]; then
                  echo "Applying Android platform detection fix..."
                  patch -p1 -d "${TERMUX_PKG_SRCDIR}" \
                    -i "${TERMUX_PKG_BUILDER_DIR}/0002-fix-android-platform-detection.patch" || {
                      echo "Warning: Could not apply Android platform detection patch"
                      echo "This may be due to upstream changes. Build will continue."
                  }
              fi
          }
          EOFBUILD
          
          echo "📋 Build configuration:"
          echo "  UV Version: $VERSION"
          echo "  Patches: sys-info fix + Android platform detection fix"
          echo ""
          
          echo "🚀 Starting build..."
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 uv
          
          # Verify the build output
          if [ -f "output/uv_${VERSION}_aarch64.deb" ]; then
            echo "✅ Build complete! Package created:"
            ls -lh output/uv_*.deb
          else
            echo "❌ Build failed - .deb package not found"
            exit 1
          fi
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uv-aarch64
          path: termux-packages/output/*.deb
          retention-days: 30

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: debs
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-version.outputs.uv_version }}
          name: UV ${{ needs.check-version.outputs.uv_version }} for Termux
          body: |
            UV ${{ needs.check-version.outputs.uv_version }} built for Termux with Android platform detection fix.
            
            ## 🚀 Installation
            
            ### Quick Install
            ```bash
            pkg install wget
            wget https://github.com/${{ github.repository }}/releases/download/${{ needs.check-version.outputs.uv_version }}/uv_${{ needs.check-version.outputs.uv_version }}_aarch64.deb
            pkg install ./uv_*.deb
            ```
            
            ### Recommended Setup
            Add to your `~/.bashrc` to avoid file locking issues:
            ```bash
            export UV_CACHE_DIR=$PREFIX/tmp/uv-cache
            mkdir -p $PREFIX/tmp/uv-cache
            ```
            
            ## ✅ What's Fixed
            
            This build includes a critical fix for [issue #9559](https://github.com/astral-sh/uv/issues/9559):
            
            - **Python <3.13**: Returns `manylinux_2_17` platform tags (matches setuptools behavior)
            - **Python 3.13+**: Returns `android` platform tags (per PEP 738)
            - **Result**: Prevents unnecessary package rebuilds and enables proper cache reuse
            
            ### Technical Details
            
            **The Problem:**
            - UV detected `android` platform on all Python versions
            - Setuptools creates `linux_aarch64` wheels on Python <3.13
            - Platform mismatch → UV rejected cached wheels → rebuilt everything
            
            **The Solution:**
            - Python <3.13: Use `manylinux` tags (compatible with setuptools)
            - Python 3.13+: Use `android` tags (official support via PEP 738)
            - Result: Platform tags match → cache reuse works! 🎉
            
            ## 🧪 Verification
            
            Test that cache reuse works properly:
            
            ```bash
            # Set cache location
            export UV_CACHE_DIR=$PREFIX/tmp/uv-cache
            mkdir -p $PREFIX/tmp/uv-cache
            
            # First project - builds from source
            mkdir ~/test1 && cd ~/test1
            uv init
            time uv add pyzmq==25.1.1  # Takes ~2-5 minutes
            
            # Second project - should use cache!
            cd ~ && mkdir ~/test2 && cd ~/test2
            uv init
            time uv add pyzmq==25.1.1  # Should be instant!
            ```
            
            **Expected Result:** Second project shows "Prepared 0 packages" and completes in seconds! ✅
            
            ## 📦 Package Info
            
            - **Version**: ${{ needs.check-version.outputs.uv_version }}
            - **Architecture**: aarch64 (64-bit ARM)
            - **Patches Applied**: 
              - Termux sys-info compatibility fix
              - Android platform detection fix (Python <3.13)
            
            ## 🔗 Links
            
            - [Original Issue #9559](https://github.com/astral-sh/uv/issues/9559)
            - [PEP 738 - Android Platform](https://peps.python.org/pep-0738/)
            - [UV Documentation](https://docs.astral.sh/uv/)
            - [Report Issues](https://github.com/${{ github.repository }}/issues)
          files: debs/**/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
